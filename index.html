<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Oficial USACH</title>
    
    <!-- Librería de mapas -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <script src="https://jsdelivr.net"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #1a1a2e; /* Fondo oscuro elegante */
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Configuramos un mapa plano (CRS.Simple) para usar la imagen oficial de la USACH
            const map = L.map('map', {
                crs: L.CRS.Simple,
                minZoom: -2,
                maxZoom: 2,
                zoomControl: true
            });

            // Dimensions de la imagen oficial
            const w = 1018;
            const h = 631;
            const southWest = map.unproject([0, h], map.getMaxZoom()-2);
            const northEast = map.unproject([w, 0], map.getMaxZoom()-2);
            const bounds = new L.LatLngBounds(southWest, northEast);

            // 2. Cargamos la imagen oficial del campus como fondo del mapa
            L.imageOverlay('https://githubusercontent.com', bounds).addTo(map);
            map.setMaxBounds(bounds);
            map.fitBounds(bounds);

            // 3. Ubicamos los pines interactivos en las coordenadas exactas de la imagen
            
            // Sector FAE / Planetario (Abajo a la derecha)
            L.marker([-35, 140]).addTo(map).bindPopup("<b>Planetario USACH</b><br>Entrada principal por la Alameda.");
            L.marker([-33, 148]).addTo(map).bindPopup("<b>Edificio FAE</b><br>Facultad de Administración y Economía.");

            // Sector FING / Escuela de Artes y Oficios (Arriba al centro-derecha)
            L.marker([-18, 122]).addTo(map).bindPopup("<b>Facultad de Ingeniería (FING)</b><br>Bloques de departamentos y salas.");
            L.marker([-22, 123]).addTo(map).bindPopup("<b>Sector EAO</b><br>Patrimonio histórico y salas de clase.");

            // Sector Central / Rectoría (Al centro)
            L.marker([-33, 107]).addTo(map).bindPopup("<b>Casa Central</b><br>Oficinas principales de la universidad.");
            L.marker([-31, 98]).addTo(map).bindPopup("<b>Casino Central</b><br>Zona de alimentación para estudiantes.");

            // Sector Tecnológico / Estadio (Izquierda)
            L.marker([-28, 51]).addTo(map).bindPopup("<b>Facultad Tecnológica</b><br>Salas y laboratorios del área tecnológica.");
            L.marker([-28, 28]).addTo(map).bindPopup("<b>Estadio USACH</b><br>Canchas y gimnasio principal.");
        });
    </script>
</body>
</html>
