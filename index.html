<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa USACH</title>
    
    <!-- Estilos de Leaflet modificados sin restricciones estrictas -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            background-color: #e0e0e0; /* Si se rompe el mapa, verás este fondo gris */
        }
        #map { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Script de Leaflet corregido -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Inicializamos el mapa en la USACH
        const map = L.map('map').setView([-33.4503, -70.6865], 16);

        // Cargamos una ruta alternativa y más rápida de mapas (CartoDB)
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        // Marcadores oficiales del Campus
        L.marker([-33.4485, -70.6841]).addTo(map).bindPopup("<b>Planetario USACH</b>");
        L.marker([-33.4504, -70.6872]).addTo(map).bindPopup("<b>Facultad de Ingeniería (FING)</b>");
        L.marker([-33.4491, -70.6853]).addTo(map).bindPopup("<b>Nueva FAE</b>");
        L.marker([-33.4508, -70.6848]).addTo(map).bindPopup("<b>Sector EAO</b>");
        L.marker([-33.4496, -70.6885]).addTo(map).bindPopup("<b>Casino Central</b>");
    </script>
</body>
</html>
